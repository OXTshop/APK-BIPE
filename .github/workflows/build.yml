name: Gerar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee buildlog.txt; test ${PIPESTATUS[0]} -eq 0

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bipador-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload log de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-erro
          path: buildlog.txt
